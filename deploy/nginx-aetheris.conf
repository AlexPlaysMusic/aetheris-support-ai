# Aetheris production reverse proxy (Ubuntu + nginx).
# Install: sudo cp nginx-aetheris.conf /etc/nginx/sites-available/aetheris
#          sudo sed -i 's/your-domain.me/<YOUR-DOMAIN>/' /etc/nginx/sites-available/aetheris
#          sudo ln -s /etc/nginx/sites-available/aetheris /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
# TLS:     sudo certbot --nginx -d <YOUR-DOMAIN>

server {
    listen 80;
    server_name your-domain.me;

    # Photo attachments ride in the chat POST body.
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
