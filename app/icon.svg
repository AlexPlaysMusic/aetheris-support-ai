<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="a-frame" x1="20" y1="50" x2="44" y2="12">
      <stop offset="0%" stop-color="#0EA5E9" />
      <stop offset="55%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#A5F3FC" />
    </linearGradient>
    <radialGradient id="a-halo" cx="32" cy="34" r="24">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0" />
    </radialGradient>
  </defs>
  <circle cx="32" cy="34" r="24" fill="url(#a-halo)" />
  <!-- A frame -->
  <path
    d="M19 51 L32 11 L45 51"
    stroke="url(#a-frame)"
    stroke-width="6"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- apex facet -->
  <polygon points="32,11 28.5,21 35.5,21" fill="#67E8F9" opacity="0.35" />
  <!-- inner ridge + chevron facets -->
  <line x1="32" y1="14" x2="32" y2="30" stroke="#22D3EE" stroke-width="1.2" opacity="0.7" />
  <polyline
    points="26,30 32,23 38,30"
    stroke="#67E8F9"
    stroke-width="1.2"
    opacity="0.7"
    stroke-linejoin="round"
  />
  <!-- crossbar facet -->
  <polygon
    points="24.5,39 39.5,39 36.5,45 27.5,45"
    fill="rgba(34,211,238,0.18)"
    stroke="#67E8F9"
    stroke-width="1.4"
    stroke-linejoin="round"
  />
  <!-- dotted LED eyes in the counter -->
  <g fill="#67E8F9">
    <circle cx="27.5" cy="33" r="0.9" />
    <circle cx="30" cy="33" r="0.9" />
    <circle cx="27.5" cy="35.4" r="0.9" opacity="0.55" />
    <circle cx="30" cy="35.4" r="0.9" opacity="0.55" />
    <circle cx="34" cy="33" r="0.9" />
    <circle cx="36.5" cy="33" r="0.9" />
    <circle cx="34" cy="35.4" r="0.9" opacity="0.55" />
    <circle cx="36.5" cy="35.4" r="0.9" opacity="0.55" />
  </g>
  <!-- circuit accents on the legs -->
  <circle cx="23" cy="45" r="1.3" stroke="#22D3EE" stroke-width="1.1" opacity="0.8" />
  <circle cx="41" cy="45" r="1.3" stroke="#22D3EE" stroke-width="1.1" opacity="0.8" />
</svg>
